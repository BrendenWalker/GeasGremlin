services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rpghub-backend
    ports:
      - "8140:80"
    env_file:
      - .env
    environment:
      - PORT=80
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-rpghub}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      rpghub-network:
        aliases:
          - rpghub-backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rpghub-frontend
    ports:
      - "8150:80"
    depends_on:
      - backend
    networks:
      rpghub-network:
        aliases:
          - rpghub-frontend
    restart: unless-stopped

networks:
  rpghub-network:
    driver: bridge
