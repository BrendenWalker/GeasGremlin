services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rpghub-backend
    ports:
      - "8100:80"
    env_file:
      - .env
    environment:
      - PORT=80
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-rpghub}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rpghub-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:80/api/health', (r)=>{ let d=''; r.on('data',c=>d+=c); r.on('end',()=>process.exit(r.statusCode===200?0:1)); }).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rpghub-frontend
    ports:
      - "8101:80"
    depends_on:
      - backend
    networks:
      - rpghub-network
    restart: unless-stopped

networks:
  rpghub-network:
    driver: bridge
